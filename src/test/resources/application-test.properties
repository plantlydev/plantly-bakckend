# src/test/resources/application-test.properties

# H2 datasource 를 명시한다. (예전엔 datasource 미지정으로 "우연히" 임베디드 H2 가 떴고
# CI 가 -D 로 Postgres 를 주입했다 — 이제 test=H2 를 선언으로 고정한다.
# pg_trgm/GIN 이 필요한 검색 테스트는 별도 Testcontainers PG 베이스에서 @DynamicPropertySource 로 격리.)
spring.datasource.url=jdbc:h2:mem:plantly;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
# base 에서 이미 opt-in(off)이지만, "test=Flyway 없음"을 테스트 설정에서도 명시적으로 못박는다.
spring.flyway.enabled=false
# 참조데이터 seed 는 테스트에서 실행하지 않는다 (테스트는 각자 픽스처로 데이터 구성).
spring.sql.init.mode=never

# ===== 국세청 API (테스트) =====
# 테스트는 절대 외부를 호출하지 않는다. 판정 분기는 FakeNtsClient 의 사업자번호 끝 4자리 규칙으로 태운다.
app.nts.fake=true
app.nts.service-key=test-fake-key-not-a-real-nts-key

# ===== 소셜 로그인 (테스트) =====
# 테스트는 네이버를 호출하지 않는다. 토큰 교환·사용자 정보 호출은 테스트가 가짜 빈으로 바꾼다(OAuth2ClientConfig).
spring.security.oauth2.client.registration.naver.client-id=test-naver-client-id
spring.security.oauth2.client.registration.naver.client-secret=test-naver-client-secret

# ===== 자체 로그인 (테스트) =====
# 인수 테스트(AcceptanceTest 등)는 자체 회원가입·로그인으로 세션을 만든다. 꺼진 상태는 LocalLoginDisabledTest 가 따로 검증한다.
app.auth.local-login-enabled=true
