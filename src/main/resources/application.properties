spring.application.name=plantly

spring.profiles.active=local

# ===== Flyway =====
# 기본 비활성(opt-in). Postgres 환경(local/운영)에서만 명시적으로 켠다.
# H2 테스트나 신규 프로파일이 실수로 PG 전용 마이그레이션(pg_trgm 등)을 타는 것을 구조적으로 차단.
spring.flyway.enabled=false

# ===== 락 대기 상한 =====
# Postgres 는 락 대기가 기본 무한이라, 락을 쥔 트랜잭션이 끝나지 않으면(커밋을 잊은 DB 도구 세션, 멈춘 요청)
# 같은 행을 원하는 요청이 커넥션을 쥔 채 끝없이 기다리고, 풀이 마르면 무관한 요청까지 멈춘다.
# JPA 의 jakarta.persistence.lock.timeout 힌트는 Hibernate 6.6 Postgres 방언이 양수 값을 버려 효과가 없으므로
# 연결 단위 lock_timeout 으로 건다. 접속 주소가 Postgres 일 때 PostgresLockTimeoutConfig 가 이 값을 연결 옵션으로
# 붙이므로 프로파일마다 따로 넣을 필요가 없다(H2 인수 테스트는 영향 없음).
# 락을 쥐는 트랜잭션은 길어야 수백 ms(국세청 호출은 트랜잭션 밖)라 정상 대기는 넉넉히 넘는다.
# 넘기면 GlobalExceptionHandler 가 409(RESOURCE_BUSY)로 돌려준다.
app.db.lock-timeout=3s

spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.use_sql_comment=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ===== Pageable =====
# 클라이언트가 ?size=100000 같은 과도한 페이지 크기를 요청해도 이 값으로 제한.
spring.data.web.pageable.max-page-size=100
# 요청 page 파라미터를 1-based로 받는다. (?page=1 → 첫 페이지)
# 내부 Pageable.getPageNumber()는 여전히 0-based이므로 PageResponse 의 (+1) 변환과 일관됨.
spring.data.web.pageable.one-indexed-parameters=true

# ===== Session (JSESSIONID) =====
# 유휴 만료 1일. remember-me 를 쓰지 않으므로 '로그인 유지'는 이 값이 맡는다.
# JSESSIONID 는 세션 쿠키라 브라우저를 닫으면 끝난다. 세션이 메모리에 있어 서버 재시작 시 전원 로그아웃된다.
server.servlet.session.timeout=1d
server.servlet.session.cookie.http-only=true
# 동일 사이트(예: localhost:3000 -> localhost:8080)에서는 lax로 충분.
# 프로덕션에서 FE/BE 도메인이 완전히 다르면 same-site=none + cookie.secure=true 로 변경 필요.
server.servlet.session.cookie.same-site=lax

# ===== Remember-Me (현재 비활성화 — 재도입 시 사용) =====
# 첫 배포는 remember-me 를 쓰지 않아 지금은 읽는 곳이 없다(SecurityConfig 참고). 재도입 시 토큰 서명 키로 쓴다.
# 그때는 프로덕션에서 환경변수/시크릿(REMEMBER_ME_KEY)으로 반드시 외부화할 것.
app.remember-me.key=${REMEMBER_ME_KEY:plantly-remember-me-dev-key-change-me}

# ===== CORS (FE/BE origin이 다를 때) =====
# 쉼표로 여러 origin 지정 가능. allowCredentials=true 이므로 와일드카드(*)는 사용 불가.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ===== 프론트 주소 =====
# 브라우저가 실제로 보는 사이트 주소. 소셜 로그인의 redirect-uri 와 로그인 성공·실패 후 이동할 곳을 이 값으로 만든다.
# 로컬은 Next(3000)가 /oauth2/**, /login/oauth2/** 를 백엔드로 넘긴다(프론트 rewrites).
app.frontend.base-url=${APP_BASE_URL:http://localhost:3000}

# ===== 자체 로그인 =====
# 이메일·비밀번호 로그인(POST /api/v1/auth/login)과 회원가입(POST /api/v1/users/sign-up) 허용 여부.
# 첫 배포는 소셜 로그인 전용이라 기본값은 false — 꺼져 있으면 두 API 가 404 다(LocalLoginDisabledFilter).
# 설정을 빠뜨리면 닫힌 쪽이 되도록 기본값을 false 로 둔다. 로컬(시드 계정)·테스트 프로파일만 true 로 켠다.
# 관리자도 네이버로 로그인한다. 최초 관리자는 운영 DB 에서 일회성 SQL 로 승격한다(docs/운영-최초-관리자-지정.md).
app.auth.local-login-enabled=false

# ===== 소셜 로그인: 네이버 =====
# 클라이언트 ID·시크릿은 시크릿이라 커밋된 값 없이 환경변수로만 받는다. 없으면 부팅이 실패한다(국세청 키와 같은 원칙).
# 기본값을 빈 문자열(${X:})로 두는 게 핵심이다. 기본값 없는 ${X} 는 환경변수가 없어도 실패하지 않고
# "${X}" 글자가 그대로 client_id 로 나가 네이버 오류 화면이 뜬다. 빈 값이면 id 는 부트가, secret 은 OAuth2ClientConfig 가 부팅을 막는다.
# 로컬: 프로젝트 루트 .env(application-local.properties 의 spring.config.import) 또는 IDE 실행 환경변수.
# 운영: 배포 환경 환경변수. 테스트: application-test.properties 의 가짜 값.
# 받는 항목(이메일·이름)은 scope 가 아니라 네이버 개발자센터의 '제공 정보' 설정이 정한다.
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:}
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
# 개발자센터에 등록한 Callback URL 과 글자 하나까지 같아야 한다.
spring.security.oauth2.client.registration.naver.redirect-uri=${app.frontend.base-url}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
# 네이버 응답은 {"response":{...}} 로 감싸져 온다. 실제 값 꺼내기는 NaverProfileExtractor 가 한다.
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# ===== 가입 동의 항목의 약관 버전 =====
# 항목(필수 여부·표시 순서)은 ConsentType 이 정하고, 여기는 각 항목의 현재 버전만 둔다. 하나라도 없으면 부팅이 실패한다.
# 약관을 개정하면 버전을 올린다 — 동의 기록(user_consent)에 동의 당시 버전이 남는다.
# 약관 본문은 출시 전(네이버 검수 신청 전)에 확정한다. 그때까지는 v1.
app.consent.versions.AGE_OVER_14=v1
app.consent.versions.TERMS_OF_SERVICE=v1
app.consent.versions.PRIVACY_COLLECTION=v1
app.consent.versions.MARKETING=v1

# ===== 메인 화면 노출 영역(스팟라이트/추천/최근 등록) =====
# 각 레일에 실제로 노출할 자리 수. 후보(관리자가 고정한 회사)가 이 값을 넘으면 초과분은 잘리고
# CompanyQueryService 가 경고 로그를 남긴다. 상수가 아니라 설정값인 이유는 "자리를 늘린다"가
# 초과에 대한 가장 흔한 대응이라 코드 수정 없이 대응할 수 있어야 하기 때문이다.
app.showcase.spotlight-slots=5
app.showcase.featured-slots=8

# 최근 등록 레일. 위 둘과 달리 노출 자격이 아니라 화면 분량이라 초과 경고를 붙이지 않는다
# (후보가 공개 회사 전체라 항상 초과다). 더 보려면 목록 화면으로 넘어가므로 늘릴 이유가 없다.
app.showcase.latest-slots=12

# ===== 국세청 사업자등록정보 진위확인/상태조회 API =====
# 공공데이터포털에서 발급받은 서비스 키. 시크릿이므로 커밋된 기본값 없이 환경변수(NTS_SERVICE_KEY)로만 주입한다.
# 로컬: 셸/IDE 실행 환경변수로 설정. CI: GitHub Actions secret. 운영: 배포 환경 환경변수.
# 반드시 '디코딩된' 키를 넣는다 — 인코딩된 키를 넣으면 이중 인코딩되어 인증 오류가 난다.
app.nts.service-key=${NTS_SERVICE_KEY:}

# 가짜 클라이언트 사용 여부. 기본 false(=실제 호출)이며, false 인데 service-key 가 비어 있으면 부팅이 실패한다.
# "키가 없으면 자동으로 fake" 로 하지 않는 이유는, 운영에서 환경변수 주입이 실패했을 때
# 조용히 아무 사업자번호나 통과시키는 사고를 막기 위해서다. 로컬/테스트에서만 명시적으로 true 로 켠다.
app.nts.fake=${NTS_FAKE:false}

# ===== 사업자 인증 정책 =====
# 발급된 인증의 유효기간. 짧게 잡는다고 더 안전해지지 않는다 — 이 값이 막는 것은 "인증만 받아두고 방치한
# 사이 폐업 등으로 상태가 바뀌는 것" 인데, 그건 분 단위로 일어나는 사건이 아니다. 반대로 짧으면 정상
# 사용자가 폼 작성 도중 만료를 만나고, 그때마다 발행 경로가 국세청에 재질의해 쿼터만 두 배로 쓴다.
# 그 사이의 상태 변화는 발행 시점 자동 재질의(CompanyVerificationService#refreshIfExpired)가 대신 막는다.
app.verification.ttl=${VERIFICATION_TTL:7d}
# 하루에 사용자가 직접 누를 수 있는 인증 시도 횟수. 자동 재질의는 여기서 빠진다(사용자가 누른 적 없는 호출).
app.verification.daily-attempt-limit=${VERIFICATION_DAILY_ATTEMPT_LIMIT:5}

# 국세청 응답이 느려질 때 요청 스레드를 오래 붙잡지 않도록 짧게 잡는다.
app.nts.connect-timeout=3s
app.nts.read-timeout=5s

# ===== 파일 업로드 =====
# 한 장당 상한. 조정할 값은 이것 하나다 — 업로드 제약 API 가 이 값을 그대로 프론트에 내려주고, 서블릿
# multipart 상한(파일 = 이 값, 요청 = 이 값 + 1MB)도 여기서 도출한다(StorageConfig). 그래서
# spring.servlet.multipart.max-* 는 쓰지 않는다(써도 읽히지 않는다). 요청 상한을 따로 두면 파일 상한만 올린
# 배포에서 프론트가 통과시킨 파일을 서블릿이 끊는다.
app.upload.max-file-size=${UPLOAD_MAX_FILE_SIZE:10MB}

# 로컬 디스크 저장 위치. 저장소가 S3/Supabase 로 바뀌면 이 블록 대신 형제 블록(app.upload.s3.*)이 생기고,
# 발급되는 URL(/api/v1/files/{key})과 회사 DTO 는 그대로다.
app.upload.local.base-dir=${UPLOAD_DIR:./uploads}
